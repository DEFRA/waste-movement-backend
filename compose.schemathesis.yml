# Self-contained stack for property-based API testing of the beta-2 OpenAPI
# contract with Schemathesis. Needs no secrets: every credential below is a
# throwaway value that only exists inside this compose network.
#
# Run via `npm run test:schemathesis` (see test/schemathesis/README.md).

name: waste-movement-backend-schemathesis

x-local-creds:
  # base64("waste-movement-backend=schemathesis-local") — lets this service
  # call waste-tracking-id-backend
  backend-to-id-backend: &backend-to-id-backend d2FzdGUtbW92ZW1lbnQtYmFja2VuZD1zY2hlbWF0aGVzaXMtbG9jYWw=
  # base64("schemathesis=schemathesis-local") — the Schemathesis caller
  schemathesis-to-backend: &schemathesis-to-backend c2NoZW1hdGhlc2lzPXNjaGVtYXRoZXNpcy1sb2NhbA==

services:
  mongodb:
    image: mongo:6.0.13
    command: ['--replSet', 'rs0', '--bind_ip_all']
    tmpfs:
      - /data/db
    healthcheck:
      # Initiates the single-node replica set on first run, then reports
      # healthy once this node is PRIMARY
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  # One-shot: inserts the movements/deliveries the OpenAPI examples refer to
  seed:
    image: mongo:6.0.13
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./src/schemas/beta-2:/spec:ro
      - ./test/schemathesis/seed.js:/seed.js:ro
    command:
      [
        'mongosh',
        '--quiet',
        'mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true',
        '/seed.js'
      ]

  waste-tracking-id-backend:
    image: defradigital/waste-tracking-id-backend:${WASTE_TRACKING_ID_BACKEND_VERSION:-latest}
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      ENVIRONMENT: local
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      ACCESS_CRED_WASTE_MOVEMENT_BACKEND: *backend-to-id-backend
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:3001/health']
      interval: 3s
      timeout: 3s
      retries: 20

  waste-movement-backend:
    build:
      context: .
      target: production
    ports:
      - '${SCHEMATHESIS_BACKEND_PORT:-3012}:3001'
    depends_on:
      seed:
        condition: service_completed_successfully
      waste-tracking-id-backend:
        condition: service_healthy
    environment:
      PORT: 3001
      ENVIRONMENT: local
      LOG_LEVEL: warn
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGO_READ_PREFERENCE: primary
      WASTE_TRACKING_SERVICE_URL: http://waste-tracking-id-backend:3001
      SERVICE_AUTH_PASSWORD_WASTE_MOVEMENT_BACKEND: schemathesis-local
      ACCESS_CRED_SCHEMATHESIS: *schemathesis-to-backend
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:3001/health']
      interval: 3s
      timeout: 3s
      retries: 20

  schemathesis:
    # Pinned to a release at least 7 days old (workspace min-release-age policy).
    # Needs TraceCov >= 0.25.3, whose coverage report follows $refs into the
    # spec's other files.
    image: schemathesis/schemathesis:v4.31.0@sha256:58a4ffa68cd690a04eb70fd2d1c790acd54cd73986c777ec2556c901b6b707e4
    profiles: ['schemathesis']
    depends_on:
      waste-movement-backend:
        condition: service_healthy
    # /work is the only writable mount: reports and Hypothesis/Schemathesis
    # caches land in test/schemathesis/out (gitignored)
    working_dir: /work
    volumes:
      - ./src/schemas/beta-2:/spec:ro
      - ./test/schemathesis/schemathesis.toml:/config/schemathesis.toml:ro
      - ./test/schemathesis/out:/work
    command:
      [
        '--config-file',
        '/config/schemathesis.toml',
        'run',
        '/spec/openapi.json'
      ]
