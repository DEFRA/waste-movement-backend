          h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'show-responses', checked: showResp || null, onchange: (e) => { store.set('matrix-responses', e.target.checked ? '1' : '0'); renderOverview() } }), 'Include responses')),
        h('div', { class: 'matrix-wrap' }, table)),
      h('p', { class: 'foot' }, `Generated ${date.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}${M.commit ? ' from commit ' + M.commit : ''}.`)))
  }

  // Every schema and fragment that changed since the base commit, each with
  // its field changes, linked to their place in the diagram.
  const renderChanges = () => {
    const head = h('header', { class: 'view-head' },
      backLink(),
      h('div', { class: 'eyebrow' }, `${M.api.version} · since ${changes.base}`),
      h('h1', {}, "What's changed"),
      h('p', { class: 'lede' }, changes.newVersion
        ? `${M.api.version} is new: it isn't in ${changes.base}.`
        : changeTotal
          ? `Compared with the same schemas at ${changes.base}. A field counts as changed when anything shown for it changed: its type, whether it's required, its rules, allowed values, format, limits, description or the fragment it uses. Fields added or removed with everything inside them are listed once.`
          : `No schema changes since ${changes.base}.`))
    const fieldItem = (c, where) => h('li', {},
      h('div', { class: 'f-head' },
        h('span', { class: 'chg-tag ' + c.status }, CHANGE_WORD[c.status]),
        where && c.status !== 'removed' && c.path
          ? h('a', { href: hashFor(where), class: 'mono', onclick: (e) => { e.preventDefault(); go({ ...where, reveal: c.path }) } }, displayPath(c.path))
          : h('code', {}, c.path ? displayPath(c.path) : '(the schema itself)'),
        c.status === 'added' && c.required && h('span', { class: 'file' }, c.required.toLowerCase()),
        c.inside > 0 && h('span', { class: 'file' }, `with ${plural(c.inside, 'field')} inside`)),
      c.diffs && diffList(c.diffs))
    const itemOf = (c, where, title, sub) => {
      const tag = h('span', { class: 'chg-tag ' + c.status }, CHANGE_WORD[c.status])
      const name = where && c.status !== 'removed'
        ? h('a', { href: hashFor(where), class: 'c-title', onclick: (e) => { e.preventDefault(); go(where) } }, title)
        : h('span', { class: 'c-title' }, title)
      if (c.status !== 'changed') return h('div', { class: 'chg-item' }, h('div', { class: 'chg-head' }, tag, name, h('span', { class: 'file' }, sub)))
      return h('details', { class: 'chg-item', open: true },
        h('summary', {}, tag, name, h('span', { class: 'file' }, sub), h('span', { class: 'c-count' }, plural(c.fields.length, 'change'))),
        h('ul', { class: 'chg-fields' }, c.fields.map((f) => fieldItem(f, where))))
    }
    const section = (title, items) => items.length > 0 && h('section', { class: 'section' }, h('h2', {}, title), h('div', { class: 'changes' }, items))
    const rootItems = (kind) => changes.roots.filter((c) => c.kind === kind).map((c) =>
      itemOf(c, rootById[c.id] && { view: 'root', id: c.id }, c.title, c.file))
    put(main, h('div', { class: 'page' }, head,
      section('Request schemas', rootItems('request')),
      section('Response schemas', rootItems('response')),
      section('Shared fragments', changes.fragments.map((c) => {
        const f = fragByFile[c.file]
        return itemOf(c, f && { view: 'fragment', id: f.id }, c.title, c.file)
      }))))
  }

  const rootSpecFor = (tree) => {
    if (tree.type === 'array' && tree.items) return childSpec(tree, '') || null
    return childSpec(tree, '')
  }

  const renderRoot = (r) => {
    const mode = state.mode || 'diagram'
    const head = h('header', { class: 'view-head' },
      backLink(),
      h('div', { class: 'eyebrow' }, r.kind === 'request' ? 'Request schema' : 'Response schema'),
      h('h1', {}, schemaName(r)),
      h('div', { class: 'statline' },
        h('span', {}, h('b', {}, r.stats.fields), ' fields'),
        h('span', {}, h('b', {}, r.stats.fragments), ' shared fragments'),
        h('span', {}, h('b', {}, r.stats.rules), ' rules'),
        h('span', { class: 'file' }, r.file),
        changesLink(rootChanges.get(r.id))))
    const modeSeg = modeButtons(mode)

    if (mode === 'try') {
      // A focused block is tested on its own (checked in context; see harness).
      const tryWhere = { view: 'root', id: r.id }
      const whole = rootSpecFor(r.tree)
      const focused = state.focus && whole && findSpec(whole, state.focus)
      return put(main, head, h('div', { class: 'toolbar' }, modeSeg),
        focused && focusBar(tryWhere, focused, r.kind === 'request' ? 'request' : 'response'),
        harness({ file: r.file, examples: r.examples, kind: r.kind, where: tryWhere, label: focused ? blockTitle(focused) : schemaName(r), focus: focused || null }))
    }

    const where = { view: 'root', id: r.id }
    const whole = rootSpecFor(r.tree)
    if (!whole) return put(main, head, h('p', { class: 'empty' }, 'This schema has no fields to draw.'))
    const focused = state.focus && findSpec(whole, state.focus)
    const spec = focused || whole
    const canvas = makeCanvas(spec, {
      rootHeader: () => focused
        ? [h('span', { class: 'bt' }, blockTitle(focused)), h('span', { class: 'bx' }, 'on its own')]
        : [h('span', { class: 'bt' }, schemaName(r)), h('span', { class: 'bx' }, r.kind)],
      intro: () => h('div', { class: 'hint' },
        h('div', { class: 'eyebrow' }, r.kind === 'request' ? 'Request schema' : 'Response schema'),
        h('p', {}, r.tree.description ? rich(r.tree.description) : r.title),
        h('p', {}, 'Select a field to see its rules and constraints. Select a row with a + to open what is inside it. Double-click a block to open it on its own. Drag the background to move around.')),
      open: openBlock(where),
      changes: diagramChanges(rootChanges.get(r.id))
    }, state.canvas)
    currentCanvas = canvas
    put(main, head, h('div', { class: 'toolbar' }, modeSeg, canvas.controls), focused && focusBar(where, focused, r.kind === 'request' ? 'request' : 'response'), canvas.stage)
    canvas.draw()
    if (!canvas.restoreView()) canvas.showIntro()
    arrive(canvas)
  }
  let currentCanvas = null

  // Coming from a search result or a "where it appears" link: highlight the
  // other matches on this diagram, then open the way to the chosen one.
  const arrive = (canvas) => {
    const { reveal, query } = state
    delete state.reveal
    delete state.query
    if (query) canvas.highlight(query)
    if (reveal) requestAnimationFrame(() => canvas.reveal(reveal))
  }

  // ---------- Try it: check JSON against the schema ----------
  // The validators are the schemas compiled ahead of time (ajv, with the same
  // options and formats as src/schemas/validate), embedded by the generator as
  // window.schemaValidators.
  // Error types, pointers and messages: errors.js, inlined by the generator.
  const { toDetails, fromDetails } = window.schemaErrors || {}
  // The checks a route runs after the schema (checks/routes.js: reference
  // data, rules across fields, dates not in the future), bundled from the
  // API's own code as window.schemaChecks, for versions that have any.
  const runChecks = window.schemaChecks && M.checks
    ? (file, value, details) => window.schemaChecks.runChecks(M.checks.version, file, value, details)
    : (file, value, details) => details

  // A checker for one schema file: value -> { valid, errors }. JSON Schema
  // versions use the compiled validators, errors.js and the route's checks;
  // the legacy (Joi) version uses its bundled routes' own check
  // (window.legacyCheck).
  const checkerFor = (file) => {
    if (window.legacyCheck) return (value) => window.legacyCheck(file, value)
    const validate = window.schemaValidators && M.validators && window.schemaValidators[M.validators[file]]
    if (!validate) return null
    return (value) => {
      const details = runChecks(file, value, validate(value) ? [] : toDetails(validate.errors || []))
      return { valid: details.length === 0, errors: fromDetails(details) }
    }
  }

  // Where each value sits in the JSON text, keyed by its pointer segments
  // joined with "/" ("" for the whole document), for jumping from an error to
  // the editor. Only called on text that parsed.
  const spansOf = (text) => {
    const spans = new Map()
    let i = 0
    const ws = () => { while (i < text.length && /\s/.test(text[i])) i++ }
    const str = () => {
      const from = i++
      while (i < text.length && text[i] !== '"') i += text[i] === '\\' ? 2 : 1
      i++
      return JSON.parse(text.slice(from, i))
    }
    const value = (path, keyAt) => {
      ws()
      const start = keyAt ?? i
      if (text[i] === '{') {
        i++; ws()
        if (text[i] === '}') i++
        else for (;;) { ws(); const at = i; const key = str(); ws(); i++; value([...path, key], at); ws(); if (text[i++] !== ',') break }
      } else if (text[i] === '[') {
        i++; ws()
        let n = 0
        if (text[i] === ']') i++
        else for (;;) { value([...path, String(n++)]); ws(); if (text[i++] !== ',') break }
      } else if (text[i] === '"') str()
      else while (i < text.length && !/[\s,\]}]/.test(text[i])) i++
      spans.set(path.join('/'), { start, end: i })
    }
    try { value([]) } catch {}
    return spans
  }

  // A pointer as an explorer path: /wasteItems/0/physicalDetails/form becomes
  // wasteItems[].physicalDetails.form.
  const pointerToPath = (pointer) => pointer.split('/').slice(1)
    .reduce((parts, seg) => /^\d+$/.test(seg) ? [...parts.slice(0, -1), (parts.at(-1) || '') + '[]'] : [...parts, seg], [])
    .join('.')

  // The diagram row for an error's pointer, climbing to the nearest field the
  // schema has (an unknown extra field has no row of its own).
  const diagramPathFor = (where, pointer) => {
    const rows = searchEntries.filter((e) => e.where.view === where.view && e.where.id === where.id && (e.kind === 'field' || e.kind === 'variant'))
    let path = pointerToPath(pointer)
    while (path) {
      const match = rows.find((e) => e.path.replace(/<[^>]+>/g, '') === path)
      if (match) return match.path
      path = path.replace(/(\.|^)[^.]*$/, '').replace(/\[\]$/, '')
    }
    return null
  }

  // ---------- made-up values for examples ----------
  // Varies an example's data while keeping its scenario: names, addresses,
  // emails and phone numbers are made up; codes and IDs keep their shape with
  // new digits (CBDU123456 -> CBDU804213), so they still match their pattern;
  // amounts and counts move within their limits. Anything with a fixed set of
  // values (enums, consts, booleans) and free text such as reasons is kept, as
  // those are what make the example the scenario it is.
  const FAKE = {
    names: ['Acme', 'Northgate', 'Riverside', 'Greenfield', 'Harbour', 'Oakwood', 'Summit', 'Kestrel', 'Brightwater', 'Ironbridge', 'Meadowbank', 'Castleview', 'Westfield', 'Heron'],
    trades: ['Recycling', 'Waste Services', 'Haulage', 'Logistics', 'Environmental', 'Metals', 'Plastics', 'Organics', 'Transport', 'Skip Hire', 'Resource Management'],
    forms: ['Ltd', 'Ltd', 'Ltd', 'plc', 'LLP'],
    towns: ['Ashford', 'Barnsley', 'Carlisle', 'Derby', 'Exeter', 'Falkirk', 'Gloucester', 'Harrogate', 'Ipswich', 'Kendal', 'Lincoln', 'Newport', 'Omagh', 'Perth', 'Swindon', 'Wrexham'],
    sites: ['Transfer Station', 'Recycling Centre', 'Materials Recovery Facility', 'Treatment Works', 'Depot', 'Energy Recovery Facility'],
    streets: ['Mill Lane', 'Station Road', 'Quarry Way', 'Riverside Drive', 'Industrial Estate Road', 'Canal Street', 'Forge Lane', 'Wharf Road', 'Brewery Lane'],
    areas: ['B', 'BS', 'CF', 'DE', 'EX', 'GL', 'HU', 'LS', 'M', 'NE', 'NG', 'OX', 'PL', 'S', 'SN', 'YO']
  }
  const randomOf = (xs) => xs[Math.floor(Math.random() * xs.length)]
  const randomInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1))
  const digit = () => String(randomInt(0, 9))
  const letters = (n, from = 'ABCDEFGHJKLMNPRSTUVWXY') => Array.from({ length: n }, () => randomOf(from)).join('')
  const slug = (t) => (t || '').toLowerCase().replace(/\b(ltd|plc|llp)\b/g, '').replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '')
  // New digits, same letters and punctuation; the first digit of a phone
  // number stays, so 01… and 07… keep their meaning.
  const rerollDigits = (text, keepFirst) => text.replace(/\d/g, (d, i) => keepFirst && i === text.search(/\d/) ? d : digit())
  const fake = {
    organisationName: () => `${randomOf(FAKE.names)} ${randomOf(FAKE.trades)} ${randomOf(FAKE.forms)}`,
    siteName: () => `${randomOf(FAKE.towns)} ${randomOf(FAKE.sites)}`,
    fullAddress: () => `${randomInt(1, 120)} ${randomOf(FAKE.streets)}, ${randomOf(FAKE.towns)}`,
    phoneNumber: () => randomOf(['01', '07']) + Array.from({ length: 9 }, digit).join(''),
    vehicleRegistration: () => `${letters(2)}${digit()}${digit()} ${letters(3)}`,
    // UK postcodes are made up; an Eircode keeps its shape.
    postcode: (was) => /^[A-Z]\d{2} ?[A-Z0-9]{4}$/i.test(was) ? rerollDigits(was) : `${randomOf(FAKE.areas)}${randomInt(1, 9)} ${digit()}${letters(2, 'ABDEFGHJLNPQRSTUWXYZ')}`
  }
  // EWC codes are looked up in reference data, so new digits would make an
  // unrecognised code.
  const KEEP_TEXT = new Set(['reason', 'reasonForNoRegistrationNumber', 'reasonForNoAuthorisationNumber', 'otherMeansOfTransport', 'specialHandlingRequirements', 'message', 'pointer', 'ewcCodes'])

  // The schema node for `key` inside `node`, following a oneOf to the variant
  // the value is (by its discriminator).
  const fieldNode = (node, value, key) => {
    if (!node) return undefined
    if (node.type === 'variants') {
      const option = node.options.find((o) => o.label === String(value?.[node.discriminator])) || node.options[0]
      return fieldNode(option.node, value, key)
    }
    return node.fields?.find((f) => f.name === key)?.node
  }

  const vary = (value, node, key, ctx) => {
    if (Array.isArray(value)) return value.map((v) => vary(v, node?.type === 'array' ? node.items : undefined, key, ctx))
    if (value && typeof value === 'object') {
      const out = {}
      const inner = { ...ctx }
      for (const k of Object.keys(value)) {
        out[k] = vary(value[k], fieldNode(node, value, k), k, inner)
        if (k === 'organisationName' || k === 'siteName') inner.who = out[k]
      }
      return out
    }
    const c = node?.constraints || {}
    if (value === null || typeof value === 'boolean' || 'const' in c || c.enum) return value
    if (typeof value === 'number') {
      if (value === 0) return 0
      const n = value * (0.4 + Math.random() * 1.6)
      const floor = c.minimum ?? (c.exclusiveMinimum !== undefined ? c.exclusiveMinimum + (Number.isInteger(value) ? 1 : 0.1) : 0)
      return Math.max(floor, Number.isInteger(value) ? Math.max(1, Math.round(n)) : Math.round(n * 10) / 10 || 0.1)
    }
    // A date-time with new digits is rarely a real one, or one in the past.
    if (typeof value !== 'string' || KEEP_TEXT.has(key) || c.format === 'date-time') return value
    if (key === 'emailAddress') return `${slug(ctx.who) || randomOf(['info', 'office', 'waste', 'operations'])}@example.com`
    if (fake[key]) return fake[key](value)
    // Codes and IDs (anything with a pattern or digits in it): new digits.
    if (c.pattern || c.format === 'uuid' || /\d/.test(value)) return rerollDigits(value)
    return value
  }

  // A made-up version of an example that is still valid if the example was.
  const madeUp = (value, tree, check) => {
    const wasValid = check(value)?.valid
    for (let tries = 0; tries < 8; tries++) {
      const next = vary(value, tree, null, {})
      if (!wasValid || check(next)?.valid) return next
    }
    return value
  }

  // Names a schema's unnamed examples by what sets each apart, so the menu says
  // "meansOfTransport: Rail" or "with reasonForNoAuthorisationNumber" rather
  // than "Example 2". In order of preference: fields with a fixed set of values
  // (enums, consts, booleans) that differ; which optional fields are present;
  // the same again one level down; then the shortest value that differs.
  const exampleNames = (values, tree) => {
    if (values.length === 1) return ['Example']
    const isScalar = (v) => v === null || ['string', 'number', 'boolean'].includes(typeof v)
    const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v)
    const short = (v) => { const t = typeof v === 'string' ? v : JSON.stringify(v); return t.length > 28 ? t.slice(0, 27) + '…' : t }
    const join = (ks, word) => ks.slice(0, 2).join(` ${word} `) + (ks.length > 2 ? ` ${word} more` : '')

    if (values.every(isScalar)) return values.map(short)
    if (values.every(Array.isArray)) {
      const sizes = values.map((v) => plural(v.length, 'item'))
      if (new Set(sizes).size === values.length) return sizes
      const inner = exampleNames(values.map((v) => v[0]), tree?.items)
      return sizes.map((size, i) => `${size}, first ${inner[i]}`)
    }
    if (!values.every(isObj)) return values.map((v, i) => `Example ${i + 1}`)

    const fieldsOf = (t) => t?.type === 'variants' ? t.options.flatMap((o) => o.node.fields || []) : t?.fields || []
    const fields = fieldsOf(tree)
    const fixed = new Set(fields.filter((f) => f.node.constraints?.enum || 'const' in (f.node.constraints || {}) || f.node.type === 'boolean').map((f) => f.name))
    const keys = [...new Set(values.flatMap(Object.keys))]
    const differs = (k) => new Set(values.map((v) => JSON.stringify(v[k]))).size > 1
    const unique = (names) => new Set(names).size === names.length

    // 1. Differing fixed-value fields.
    let names = values.map((v) => keys.filter((k) => fixed.has(k) && differs(k) && isScalar(v[k])).slice(0, 2).map((k) => `${k}: ${short(v[k])}`).join(', '))
    if (names.every(Boolean) && unique(names)) return names
    // 2. Which optional fields each one has.
    const some = keys.filter((k) => !values.every((v) => k in v))
    const presence = values.map((v) => {
      const has = some.filter((k) => k in v)
      const lacks = some.filter((k) => !(k in v))
      return has.length ? `with ${join(has, 'and')}` : lacks.length ? `without ${join(lacks, 'or')}` : ''
    })
    names = names.map((n, i) => n || presence[i])
    if (names.every(Boolean) && unique(names)) return names
    // 3. One level down: the first object or list field that differs.
    const nested = keys.find((k) => differs(k) && values.every((v) => v[k] && typeof v[k] === 'object'))
    if (nested) {
      const sub = fields.find((f) => f.name === nested)?.node
      const inner = exampleNames(values.map((v) => v[nested]), sub?.type === 'array' ? sub : sub)
      names = names.map((n, i) => (n ? n + ', ' : '') + inner[i])
      if (unique(names)) return names
    }
    // 4. The shortest scalar value that tells them apart.
    const scalarKey = keys.filter((k) => differs(k) && values.every((v) => isScalar(v[k]))).sort((a, b) => Math.max(...values.map((v) => String(v[a]).length)) - Math.max(...values.map((v) => String(v[b]).length)))[0]
    if (scalarKey) names = names.map((n, i) => (n ? n + ', ' : '') + `${scalarKey}: ${short(values[i][scalarKey])}`)
    return unique(names) ? names : names.map((n, i) => `${n || 'Example'} (${i + 1})`)
  }

  // ---------- Try it: the form view ----------
  // The same payload as a form scoped to the schema: each field's control
  // follows its type (text, a text area for longer text, number, a select for
  // fixed values or true/false), objects are collapsible groups with optional
  // fields added on demand, variants are a select, and arrays have add, remove
  // and reorder. Every change is written back as JSON, so the JSON stays the
  // one source of truth and checking is the same in both views.
  const LONG_TEXT = 20
  const formEditor = ({ tree, onChange }) => {
    const el = h('div', { class: 'form-editor', hidden: true, role: 'group', 'aria-label': 'Form' })
    let value
    let lastErrors = []

    const getAt = (path) => path.reduce((v, k) => (v == null ? undefined : v[k]), value)
    const setAt = (path, v) => {
      if (!path.length) { value = v; return }
      getAt(path.slice(0, -1))[path.at(-1)] = v
    }
    const removeAt = (path) => {
      if (!path.length) { value = undefined; return }
      const parent = getAt(path.slice(0, -1))
      const key = path.at(-1)
      if (Array.isArray(parent)) parent.splice(key, 1)
      else delete parent[key]
    }
    const pointerOf = (path) => '/' + path.join('/')
    const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v)
    // A value change: write it back without redrawing (keeps focus).
    const changed = () => onChange(value)
    // A change of shape (add, remove, reorder, switch variant): redraw too.
    const reshaped = () => { draw(); onChange(value) }

    const constOf = (option, discriminator) => option.node.fields?.find((f) => f.name === discriminator)?.node.constraints?.const ?? option.label
    // A variant's fixed values (e.g. wasteSource: "Household"), set when it's chosen.
    const fixedOf = (option) => Object.fromEntries((option.node.fields || []).filter((f) => 'const' in (f.node.constraints || {})).map((f) => [f.name, f.node.constraints.const]))
    // The variant a value is: by its discriminator when there is one, otherwise
    // the best fit (no clash with a fixed value, most fields in common).
    const variantOf = (node, v) => {
      if (!isObj(v)) return null
      if (node.discriminator) return node.options.find((o) => v[node.discriminator] === constOf(o, node.discriminator)) || null
      let best = null
      let bestScore = -Infinity
      for (const o of node.options) {
        const fixed = fixedOf(o)
        if (Object.entries(fixed).some(([k, c]) => k in v && v[k] !== c)) continue
        const names = new Set((o.node.fields || []).map((f) => f.name))
        const keys = Object.keys(v)
        const score = keys.filter((k) => names.has(k)).length - keys.filter((k) => !names.has(k)).length + Object.keys(fixed).filter((k) => k in v).length
        if (score > bestScore) { best = o; bestScore = score }
      }
      return best
    }
    const defaultFor = (node) => {
      const c = node?.constraints || {}
      if ('const' in c) return c.const
      if (!node) return ''
      if (node.type === 'object') return {}
      if (node.type === 'variants') return node.discriminator ? { [node.discriminator]: constOf(node.options[0], node.discriminator) } : { ...fixedOf(node.options[0]) }
      if (node.type === 'array') return []
      if (node.type === 'boolean') return false
      if (node.type === 'integer' || node.type === 'number') return c.minimum ?? (c.exclusiveMinimum !== undefined ? c.exclusiveMinimum + 1 : 0)
      if (c.enum) return c.enum[0]
      return ''
    }

    const hintFor = (node) => {
      const c = node?.constraints || {}
      const parts = []
      if (c.format) parts.push(c.format)
      if (c.pattern) parts.push('must match a pattern')
      if (c.minLength !== undefined || c.maxLength !== undefined) parts.push(range(c.minLength, c.maxLength, 'character'))
      if (c.minimum !== undefined) parts.push(`≥ ${c.minimum}`)
      if (c.exclusiveMinimum !== undefined) parts.push(`> ${c.exclusiveMinimum}`)
      if (c.maximum !== undefined) parts.push(`≤ ${c.maximum}`)
      if (c.minItems !== undefined || c.maxItems !== undefined) parts.push(range(c.minItems, c.maxItems, 'item'))
      return parts.join(' · ')
    }
    const badgeFor = (req) => req && h('span', { class: 'badge ' + req }, ({ required: 'Required', conditional: 'Conditional', forbidden: 'Not allowed', optional: 'Optional' })[req])

    // A control for a single value at `path`.
    const scalar = (node, path) => {
      const v = getAt(path)
      const c = node?.constraints || {}
      const id = 'f' + pointerOf(path).replace(/[^A-Za-z0-9]/g, '_')
      const typeOk = v === undefined || (node?.type === 'string' && typeof v === 'string') ||
        ((node?.type === 'integer' || node?.type === 'number') && typeof v === 'number') ||
        (node?.type === 'boolean' && typeof v === 'boolean') || ('const' in c) || c.enum
      if (v === null) {
        return h('span', { class: 'fnull' }, h('code', {}, 'null'), ' ',
          h('button', { class: 'linkish', type: 'button', onclick: () => { setAt(path, defaultFor(node)); reshaped() } }, 'Set a value'))
      }
      if ('const' in c) return h('code', { class: 'fconst' }, fmt(c.const))
      if (c.enum || node?.type === 'boolean') {
        const options = c.enum || [true, false]
        const select = h('select', { id },
          !options.some((o) => o === v) && h('option', { value: '' }, v === undefined ? 'Choose…' : `${fmt(v)} (not allowed)`),
          options.map((o, i) => h('option', { value: String(i), selected: o === v || null }, String(o))))
        select.addEventListener('change', () => { if (select.value !== '') { setAt(path, options[Number(select.value)]); changed() } })
        return select
      }
      if (!typeOk || !node || node.type === 'any' || node.type === 'object') {
        // Anything else (a value of the wrong type, or no clear type): edit it as JSON.
        const area = h('textarea', { id, class: 'fjson', spellcheck: 'false' })
        area.value = v === undefined ? '' : JSON.stringify(v, null, 2)
        area.addEventListener('input', () => {
          try { setAt(path, JSON.parse(area.value)); area.classList.remove('bad'); changed() } catch { area.classList.add('bad') }
        })
        return area
      }
      if (node.type === 'integer' || node.type === 'number') {
        const input = h('input', { id, type: 'number', step: node.type === 'integer' ? '1' : 'any', min: c.minimum ?? null, max: c.maximum ?? null })
        input.value = v ?? ''
        input.addEventListener('input', () => {
          if (input.value === '') removeAt(path)
          else setAt(path, Number(input.value))
          changed()
        })
        return input
      }
      // Text: a text area once it is longer than LONG_TEXT, or when the field allows much more.
      const long = (typeof v === 'string' && v.length > LONG_TEXT) || (c.maxLength ?? 0) > 100
      const input = long
        ? h('textarea', { id, rows: '2', maxlength: c.maxLength ?? null })
        : h('input', { id, type: c.format === 'email' ? 'email' : 'text', maxlength: c.maxLength ?? null, spellcheck: 'false' })
      input.value = v ?? ''
      input.addEventListener('input', () => { setAt(path, input.value); changed() })
      if (!long) input.addEventListener('blur', () => { if (input.value.length > LONG_TEXT) reshaped() })
      return input
    }

    const removeButton = (path, what) => h('button', { class: 'fx', type: 'button', title: `Remove ${what}`, 'aria-label': `Remove ${what}`, onclick: () => { removeAt(path); reshaped() } }, '×')

    // A field row, or a collapsible group for a field that holds more fields.
    const fieldRow = (name, node, path, req, depth, notes) => {
      const pointer = pointerOf(path)
      const present = getAt(path) !== undefined
      const complex = node && (node.type === 'object' || node.type === 'array' || node.type === 'variants')
      const label = h('span', { class: 'flabel', title: node?.description || null }, h('span', { class: 'fname' }, name), badgeFor(req))
      if (!present) {
        return h('div', { class: 'frow absent', 'data-pointer': pointer },
          label,
          h('div', { class: 'fctl' }, h('button', { class: 'btn fadd', type: 'button', onclick: () => { setAt(path, defaultFor(node)); reshaped() } }, `+ Add ${name}`)),
          h('span', {}), h('div', { class: 'ferrs' }))
      }
      if (complex && typeof getAt(path) === 'object' && getAt(path) !== null) {
        return h('details', { class: 'fgroup', open: depth < 2 || null, 'data-pointer': pointer },
          h('summary', {}, label, h('span', { class: 'ftype' }, typeLabel(node)), removeButton(path, name)),
          h('div', { class: 'ferrs' }),
          notes?.length > 0 && h('div', { class: 'fnotes' }, notes.map((n) => h('div', {}, rich(n)))),
          body(node, path, depth + 1))
      }
      const hint = hintFor(node)
      return h('div', { class: 'frow', 'data-pointer': pointer },
        label,
        h('div', { class: 'fctl' }, scalar(node, path), (hint || notes?.length > 0) && h('div', { class: 'fhint' }, hint, notes?.length > 0 && h('span', {}, hint ? ' · ' : '', rich(notes[0])))),
        removeButton(path, name),
        h('div', { class: 'ferrs' }))
    }

    // skip: a field already set by the variant select (its discriminator).
    const objectBody = (node, path, depth, skip) => {
      const v = getAt(path)
      const known = new Set(node.fields.map((f) => f.name))
      const rows = []
      const optional = []
      for (const f of node.fields) {
        if (f.name === skip) continue
        const present = v[f.name] !== undefined
        if (!present && (f.req === 'optional' || f.req === 'forbidden')) { if (f.req === 'optional') optional.push(f); continue }
        rows.push(fieldRow(f.name, f.node, [...path, f.name], f.req, depth, f.notes))
      }
      // Fields the schema doesn't have: shown so they can be seen and removed.
      for (const k of Object.keys(v)) if (!known.has(k)) rows.push(fieldRow(k, null, [...path, k], 'forbidden', depth))
      if (optional.length) {
        const add = h('select', { class: 'fmore', 'aria-label': 'Add an optional field' },
          h('option', { value: '' }, `+ Add an optional field (${optional.length})`),
          optional.map((f) => h('option', { value: f.name }, f.name)))
        add.addEventListener('change', () => {
          const f = optional.find((o) => o.name === add.value)
          if (f) { setAt([...path, f.name], defaultFor(f.node)); reshaped() }
        })
        rows.push(h('div', { class: 'frow' }, h('span', {}), h('div', { class: 'fctl' }, add)))
      }
      return rows
    }

    const body = (node, path, depth) => {
      const v = getAt(path)
      if (node.type === 'variants') {
        const disc = node.discriminator
        const current = variantOf(node, v)
        const select = h('select', { 'aria-label': disc ? `Choose ${disc}` : 'Choose a variant' },
          !current && h('option', { value: '' }, 'Choose…'),
          node.options.map((o, i) => h('option', { value: String(i), selected: o === current || null }, o.label)))
        select.addEventListener('change', () => {
          const o = node.options[Number(select.value)]
          if (!o) return
          // Keep the fields the new variant also has.
          const keep = new Set((o.node.fields || []).map((f) => f.name))
          const fixed = disc ? { [disc]: constOf(o, disc) } : fixedOf(o)
          const next = { ...fixed }
          if (isObj(v)) for (const [k, val] of Object.entries(v)) if (keep.has(k) && !(k in fixed)) next[k] = val
          setAt(path, next)
          reshaped()
        })
        return [h('div', { class: 'frow' }, h('span', { class: 'flabel' }, disc ? h('code', {}, disc) : 'Variant'), h('div', { class: 'fctl' }, select)),
          current && isObj(v) ? objectBody(current.node, path, depth, disc) : null]
      }
      if (node.type === 'array') {
        const items = Array.isArray(v) ? v : []
        const itemNode = node.items
        const out = items.map((_, i) => {
          const itemPath = [...path, i]
          const move = (to) => { const list = getAt(path); const [item] = list.splice(i, 1); list.splice(to, 0, item); reshaped() }
          const itemComplex = itemNode && (itemNode.type === 'object' || itemNode.type === 'variants' || itemNode.type === 'array') && items[i] !== null && typeof items[i] === 'object'
          return h('div', { class: 'fitem', 'data-pointer': pointerOf(itemPath) },
            h('div', { class: 'fitem-head' },
              h('span', { class: 'fname' }, `#${i + 1}`),
              h('span', { class: 'fitem-tools' },
                i > 0 && h('button', { class: 'fx', type: 'button', title: 'Move up', 'aria-label': `Move item ${i + 1} up`, onclick: () => move(i - 1) }, '↑'),
                i < items.length - 1 && h('button', { class: 'fx', type: 'button', title: 'Move down', 'aria-label': `Move item ${i + 1} down`, onclick: () => move(i + 1) }, '↓'),
                removeButton(itemPath, `item ${i + 1}`))),
            h('div', { class: 'ferrs' }),
            itemComplex ? body(itemNode, itemPath, depth + 1) : h('div', { class: 'fctl' }, scalar(itemNode, itemPath)))
        })
        const c = node.constraints || {}
        out.push(h('div', { class: 'frow' }, h('span', {}), h('div', { class: 'fctl' },
          h('button', { class: 'btn fadd', type: 'button', disabled: c.maxItems !== undefined && items.length >= c.maxItems ? true : null,
            onclick: () => { if (!Array.isArray(getAt(path))) setAt(path, []); getAt(path).push(defaultFor(itemNode)); reshaped() } }, '+ Add item'),
          c.minItems ? h('span', { class: 'fhint' }, ` at least ${plural(c.minItems, 'item')}`) : null)))
        return out
      }
      if (node.type === 'object') return isObj(v) ? objectBody(node, path, depth) : [h('div', { class: 'fctl' }, scalar(null, path))]
      return [h('div', { class: 'fctl' }, scalar(node, path))]
    }

    const draw = () => {
      const complexRoot = tree && (tree.type === 'object' || tree.type === 'array' || tree.type === 'variants') && value !== null && typeof value === 'object'
      put(el,
        h('div', { class: 'ferrs root', 'data-pointer': '/' }),
        complexRoot ? body(tree, [], 0) : h('div', { class: 'frow', 'data-pointer': '/' }, h('span', { class: 'flabel' }, 'Value'), h('div', { class: 'fctl' }, scalar(tree, [])), h('span', {}), h('div', { class: 'ferrs' })))
      showErrors(lastErrors)
    }

    // Each error next to its field, or the nearest one shown.
    const showErrors = (errors) => {
      lastErrors = errors
      el.querySelectorAll('.ferrs').forEach((e) => e.replaceChildren())
      el.querySelectorAll('.has-err').forEach((e) => e.classList.remove('has-err'))
      for (const e of errors) {
        const segs = (e.pointer || '/').split('/').slice(1).filter(Boolean)
        let target = null
        for (let k = segs.length; k >= 0 && !target; k--) target = el.querySelector(`[data-pointer="${CSS.escape('/' + segs.slice(0, k).join('/'))}"]`)
        if (!target) continue
        target.classList.add('has-err')
        const slot = target.querySelector(':scope > .ferrs') || target.querySelector('.ferrs')
        slot?.append(h('div', {}, h('b', {}, e.errorType), ' ', e.message))
      }
    }

    const focus = (pointer) => {
      const segs = pointer.split('/').slice(1).filter(Boolean)
      let target = null
      for (let k = segs.length; k >= 0 && !target; k--) target = el.querySelector(`[data-pointer="${CSS.escape('/' + segs.slice(0, k).join('/'))}"]`)
      if (!target) return
      for (let a = target; a && a !== el; a = a.parentElement) if (a.tagName === 'DETAILS') a.open = true
      target.scrollIntoView({ block: 'center', behavior: 'smooth' })
      target.querySelector('input, select, textarea, button')?.focus({ preventScroll: true })
    }

    return {
      el,
      render: (v) => { value = structuredClone(v); draw() },
      showErrors,
      focus
    }
  }

  // focus: a block shown on its own (double-click). Only that part is edited;
  // to check it, it's put back into the schema's first example and the whole
  // payload is checked as usual, so rules that look at other fields still
  // apply, and only the errors inside the block are shown, relative to it.
  const harness = ({ file, examples, kind, where, label, focus }) => {
    const wholeChecker = checkerFor(file)
    if (!wholeChecker) return h('p', { class: 'empty' }, 'Validation isn\'t available for this schema.')

    // "movement.wasteItems[].pops" -> ['movement', 'wasteItems', 0, 'pops'].
    const concrete = focus
      ? focus.path.replace(/<[^>]+>/g, '').split('.').filter(Boolean).flatMap((part) => {
        const [name, ...arrays] = part.split('[]')
        return [...(name ? [name] : []), ...arrays.map(() => 0)]
      })
      : []
    const base = '/' + concrete.join('/')
    const pick = (value) => concrete.reduce((v, k) => (v == null ? undefined : v[k]), value)
    const firstExample = !examples ? undefined : Array.isArray(examples) ? examples[0] : Object.values(examples)[0]?.value
    const inContext = (part) => {
      const whole = firstExample === undefined ? {} : structuredClone(firstExample)
      let node = whole
      concrete.forEach((key, i) => {
        if (i === concrete.length - 1) return
        if (node[key] == null || typeof node[key] !== 'object') node[key] = typeof concrete[i + 1] === 'number' ? [] : {}
        node = node[key]
      })
      if (part === undefined) delete node[concrete.at(-1)]
      else node[concrete.at(-1)] = part
      return whole
    }
    const checker = !focus ? wholeChecker : (part) => {
      const outcome = wholeChecker(inContext(part))
      const inside = outcome.errors
        .filter((e) => e.pointer === base || (e.pointer || '').startsWith(base + '/'))
        .map((e) => ({ ...e, fullPointer: e.pointer, pointer: e.pointer.slice(base.length) || '/' }))
      return { valid: inside.length === 0, errors: inside }
    }

    const tree = focus ? focus.node : fragByFile[file]?.tree || rootByFile[file]?.tree
    if (focus && examples) {
      // The focused part of each example.
      examples = Array.isArray(examples)
        ? examples.map(pick).filter((v) => v !== undefined)
        : Object.fromEntries(Object.entries(examples).map(([k, ex]) => [k, { ...ex, value: pick(ex.value) }]).filter(([, ex]) => ex.value !== undefined))
    }
    const entries = !examples ? [] : Array.isArray(examples)
      ? exampleNames(examples, tree).map((name, i) => [name, { value: examples[i] }])
      : Object.entries(examples)
    const starters = [...entries.map(([name, ex]) => ({ name, summary: ex.summary, value: ex.value })),
      { name: 'Empty', summary: 'Start from nothing', value: (focus || kind === 'fragment') && !isComplex(tree || {}) ? '' : tree?.type === 'array' ? [] : {} }]
    const draftKey = `draft:${M.api.version}:${file}${focus ? '#' + focus.path : ''}`
    const draft = store.get(draftKey)
    // On by default: each example loads with made-up values.
    let varyValues = store.get('vary') !== '0'
    const textOf = (st) => JSON.stringify(varyValues && st.value !== '' ? madeUp(st.value, tree, checker) : st.value, null, 2)

    const editor = h('textarea', { class: 'editor', id: 'try-editor', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': `JSON to check against ${label}` })
    editor.value = draft ?? textOf(starters[0])
    const status = h('div', { class: 'editor-status' })
    const result = h('div', { 'aria-live': 'polite' })
    const caption = h('span', { class: 'pane-note' })

    // JSON or form: two views of the same payload, the JSON being the truth.
    let inputMode = 'json'
    let timer
    const form = formEditor({
      tree,
      onChange: (value) => {
        editor.value = value === undefined ? '' : JSON.stringify(value, null, 2)
        clearTimeout(timer)
        timer = setTimeout(() => { store.set(draftKey, editor.value); check() }, 150)
      }
    })
    const modeButtons = {}
    const setInputMode = (mode, { remember = true } = {}) => {
      if (mode === 'form') {
        let value
        try { value = editor.value.trim() === '' ? undefined : JSON.parse(editor.value) } catch {
          status.textContent = 'Fix the JSON before switching to the form'
          return
        }
        form.render(value)
        check()
      }
      inputMode = mode
      editor.hidden = mode === 'form'
      form.el.hidden = mode !== 'form'
      formatButton.hidden = mode === 'form'
      for (const [m, b] of Object.entries(modeButtons)) b.setAttribute('aria-pressed', m === mode ? 'true' : 'false')
      if (remember) store.set('try-input', mode)
    }
    // After the JSON changes from outside the form (an example, new values).
    const refreshForm = () => {
      if (inputMode !== 'form') return
      try { form.render(editor.value.trim() === '' ? undefined : JSON.parse(editor.value)) } catch { setInputMode('json', { remember: false }) }
    }

    const select = h('select', { id: 'try-start', 'aria-label': 'Load an example' },
      h('option', { value: '' }, draft ? 'Your edits' : 'Load…'),
      starters.map((st, i) => h('option', { value: i }, st.name)))
    select.addEventListener('change', () => {
      const st = starters[Number(select.value)]
      if (!st) return
      editor.value = textOf(st)
      caption.textContent = st.summary || ''
      store.set(draftKey, editor.value)
      refreshForm()
      check()
      if (inputMode === 'json') editor.focus()
    })

    const jumpTo = (pointer) => {
      if (inputMode === 'form') return form.focus(pointer)
      const spans = spansOf(editor.value)
      const segs = pointer.split('/').slice(1)
      let span = null
      for (let k = segs.length; k >= 0 && !span; k--) span = spans.get(segs.slice(0, k).join('/'))
      if (!span) return
      // Select just the first line of the value: the key, or the opening brace.
      const lineEnd = editor.value.indexOf('\n', span.start)
      const end = lineEnd > span.start && lineEnd < span.end ? lineEnd : span.end
      editor.focus()
      editor.setSelectionRange(span.start, end)
      const line = editor.value.slice(0, span.start).split('\n').length - 1
      const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 20
      editor.scrollTop = Math.max(0, line * lineHeight - editor.clientHeight / 3)
    }

    // Whether the route also runs checks a schema can't say (reference data,
    // dates not in the future…).
    const routeChecks = (M.checks?.files || []).includes(file)
    const subject = focus ? `This ${label} is valid.`
      : kind === 'request' && routeChecks ? 'This body is valid against the request schema and the API\'s other checks.'
      : kind === 'request' ? 'This body is valid against the request schema.'
      : kind === 'response' ? 'This body is valid against the response schema.'
        : `This is a valid ${label}.`

    const check = () => {
      let value
      try {
        value = JSON.parse(editor.value)
      } catch (err) {
        status.textContent = 'Not valid JSON'
        form.showErrors([])
        put(result, h('div', { class: 'verdict json' },
          h('b', {}, 'Not valid JSON'),
          h('p', {}, err.message)))
        return
      }
      status.textContent = 'JSON ok'
      const outcome = checker(value)
      form.showErrors(outcome.valid ? [] : outcome.errors)
      if (outcome.valid) {
        put(result, h('div', { class: 'verdict ok' },
          h('b', {}, '✓ Valid'),
          h('p', {}, subject)))
        return
      }
      const errors = outcome.errors
      const detail = `${errors.length} validation error${errors.length === 1 ? '' : 's'} occurred`
      put(result,
        h('div', { class: 'verdict bad' },
          h('b', {}, detail),
          kind === 'fragment' && h('p', {}, 'Inside a request, each pointer starts with the path to the field that holds this fragment.'),
          focus && h('p', {}, h('span', {}, 'Pointers are relative to '), h('code', {}, displayPath(focus.path)), '.')),
        h('ul', { class: 'errs' }, errors.map((e) => {
          const diagramPath = diagramPathFor(where, e.fullPointer ?? e.pointer)
          return h('li', { class: 'err' },
            h('div', { class: 'err-top' }, h('span', { class: 'et' }, e.errorType), h('span', { class: 'ptr' }, e.pointer || '/')),
            h('div', { class: 'msg' }, e.message),
            h('div', { class: 'err-actions' },
              h('button', { class: 'linkish', type: 'button', onclick: () => jumpTo(e.pointer) }, 'Show in editor'),
              diagramPath && h('button', { class: 'linkish', type: 'button', onclick: () => go({ ...where, reveal: diagramPath }) }, 'Show in diagram')))
        })))
    }

    editor.addEventListener('input', () => {
      clearTimeout(timer)
      timer = setTimeout(() => { store.set(draftKey, editor.value); check() }, 200)
    })
    // Tab indents (two spaces) instead of leaving the editor.
    editor.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return
      e.preventDefault()
      editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end')
      editor.dispatchEvent(new Event('input'))
    })

    const format = () => {
      try {
        editor.value = JSON.stringify(JSON.parse(editor.value), null, 2)
        store.set(draftKey, editor.value)
        check()
      } catch {}
    }
    // Fresh made-up values for whatever is in the editor, keeping its shape.
    const newValues = () => {
      let value
      try { value = JSON.parse(editor.value) } catch { status.textContent = 'Fix the JSON first, then ask for new values'; return }
      editor.value = JSON.stringify(madeUp(value, tree, checker), null, 2)
      store.set(draftKey, editor.value)
      refreshForm()
      check()
    }
    const varyToggle = h('input', { type: 'checkbox', id: 'try-vary', checked: varyValues || null })
    varyToggle.addEventListener('change', () => { varyValues = varyToggle.checked; store.set('vary', varyValues ? '1' : '0') })
    const formatButton = h('button', { class: 'btn', type: 'button', onclick: format }, 'Format')
    const inputToggle = h('div', { class: 'seg', role: 'group', 'aria-label': 'Edit as' },
      ['form', 'json'].map((m) => (modeButtons[m] = h('button', { type: 'button', 'aria-pressed': m === 'json' ? 'true' : 'false', onclick: () => setInputMode(m) }, m === 'json' ? 'JSON' : 'Form'))))
    check()
    // The form by default; JSON if the viewer last chose it.
    if (store.get('try-input') !== 'json') setInputMode('form', { remember: false })
    return h('div', { class: 'harness' },
      h('section', { class: 'pane' },
        h('div', { class: 'pane-head' }, h('h2', {}, label),
          inputToggle,
          select,
          h('button', { class: 'btn', type: 'button', onclick: newValues, title: 'Make up new names, addresses, IDs and amounts, keeping the scenario' }, 'New values'),
          formatButton),
        h('div', { class: 'pane-sub' },
          h('label', { class: 'check' }, varyToggle, 'Made-up values when loading an example'),
          h('span', {}, 'Codes and choices that set the scenario stay as written.')),
        focus && h('p', { class: 'pane-note' }, 'Only this part is edited here. It\'s checked inside the first example, so rules that depend on other fields still apply.'),
        caption,
        editor, form.el, status),
      h('section', { class: 'pane' },
        h('div', { class: 'pane-head' }, h('h2', {}, 'Result'), h('span', { class: 'file' }, 'checked as you type')),
        result,
        routeChecks && h('p', { class: 'pane-note', style: 'padding:0 12px' }, 'Also runs the checks the API makes after the schema, such as codes against the reference data and dates not being in the future. The dates are compared with this device\'s clock.'),
        h('p', { class: 'pane-note', style: 'padding:0 12px 12px' }, draft ? 'Your edits are kept in this browser. Load an example to start again.' : 'Edits are kept in this browser, so you can come back to them.')))
  }

  const highlight = (value) => {
    return esc(JSON.stringify(value, null, 2)).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)/g, (m, str, colon, lit, num) => {
      if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`
      if (lit) return `<span class="b">${lit}</span>`
      return `<span class="n">${num}</span>`
    })
  }

  const renderFragment = (f) => {
    const byRoot = new Map()
    for (const o of f.occurrences) byRoot.set(o.root, [...(byRoot.get(o.root) || []), o])
    const order = [...requests, ...responses].filter((r) => byRoot.has(r.id))
    const t = f.tree
    const head = h('header', { class: 'view-head' },
      backLink(),
      h('div', { class: 'eyebrow' }, 'Shared fragment'),
      h('h1', {}, f.title),
      h('div', { class: 'file' }, f.file),
      f.description && h('p', { class: 'lede' }, rich(f.description)),
      h('div', { class: 'statline' },
        h('span', {}, 'Used ', h('b', {}, f.occurrences.length), f.occurrences.length === 1 ? ' time' : ' times'),
        h('span', {}, 'in ', h('b', {}, endpointCount(f)), ` of ${requests.length} request schemas`),
        changesLink(fragChanges.get(f.file))))

    const usedIn = h('div', { class: 'hint' },
      h('div', { class: 'sub' }, 'Where it appears'),
      order.map((r) => h('div', {},
        h('div', {}, h('b', {}, schemaName(r))),
        h('ul', { class: 'uselist' }, byRoot.get(r.id).map((o) => h('li', {},
          h('a', { href: '#' + r.id, onclick: (e) => { e.preventDefault(); go({ view: 'root', id: r.id, reveal: o.path }) } }, displayPath(o.path)),
          o.via ? h('span', { class: 'file' }, '  inside ' + o.via) : null))))),
      f.parents.length ? [h('div', { class: 'sub' }, 'Referenced directly by'),
        h('div', { class: 'badges' }, f.parents.map((p) => p.fragment
          ? h('a', { class: 'frag-pill', href: '#f-' + p.fragment, onclick: (e) => { e.preventDefault(); go({ view: 'fragment', id: p.fragment }) } }, p.fragment)
          : h('a', { class: 'badge plain', href: '#' + p.root, style: 'text-decoration:none', onclick: (e) => { e.preventDefault(); go({ view: 'root', id: p.root }) } }, schemaName(rootById[p.root]))))] : null)

    const mode = state.mode || 'diagram'
    const tryIt = (focused) => harness({ file: f.file, examples: f.examples, kind: 'fragment', where: { view: 'fragment', id: f.id }, label: focused ? blockTitle(focused) : f.title, focus: focused || null })
    const spec = rootSpecFor(t)
    if (!spec) {
      // A single value (a pattern, a code list): its rules beside a tester.
      return put(main, h('div', { class: 'page' }, head,
        h('div', { class: 'stage', style: 'height:auto' }, h('div', { class: 'drawer' }, h('div', { class: 'sub' }, 'Rules'), facts(t, null)), h('div', { class: 'drawer' }, usedIn)),
        h('section', { class: 'section' }, h('h2', {}, 'Try it'), tryIt())))
    }
    const modeSeg = modeButtons(mode)
    if (mode === 'try') {
      const focusedTry = state.focus && findSpec(spec, state.focus)
      return put(main, head, h('div', { class: 'toolbar' }, modeSeg), focusedTry && focusBar({ view: 'fragment', id: f.id }, focusedTry, 'fragment'), tryIt(focusedTry))
    }
    const where = { view: 'fragment', id: f.id }
    const focused = state.focus && findSpec(spec, state.focus)
    const canvas = makeCanvas(focused || spec, {
      rootHeader: () => focused
        ? [h('span', { class: 'bt' }, blockTitle(focused)), h('span', { class: 'bx' }, 'on its own')]
        : [h('span', { class: 'bt' }, f.title), h('span', { class: 'bx' }, f.id)],
      intro: () => usedIn,
      open: openBlock(where),
      changes: diagramChanges(fragChanges.get(f.file))
    }, state.canvas)
    currentCanvas = canvas
    put(main, head, h('div', { class: 'toolbar' }, modeSeg, canvas.controls), focused && focusBar(where, focused, 'fragment'), canvas.stage)
    canvas.draw()
    if (!canvas.restoreView()) canvas.showIntro()
    arrive(canvas)
  }

  const render = () => {
    renderSide()
    if (state.view === 'root' && rootById[state.id]) renderRoot(rootById[state.id])
    else if (state.view === 'fragment' && fragById[state.id]) renderFragment(fragById[state.id])
    else if (state.view === 'changes' && changes) renderChanges()
    else { state = { view: 'overview', depth: state.depth || 0, from: state.from }; renderOverview() }
    // A saved view is applied once; from here the live diagram is the truth.
    delete state.canvas
    try { history.replaceState(entryOf(state), '', hashFor(state)) } catch {}
  }

  const fromHash = () => {
    const hsh = decodeURIComponent(location.hash.slice(1))
    if (hsh.startsWith('f-') && fragById[hsh.slice(2)]) return { view: 'fragment', id: hsh.slice(2) }
    if (rootById[hsh]) return { view: 'root', id: hsh }
    if (hsh === 'changes' && changes) return { view: 'changes' }
    return { view: 'overview' }
  }
  // Back and Forward (and an edited #link, which arrives with no saved state).
  window.addEventListener('popstate', (e) => { state = e.state ? { ...e.state } : { ...fromHash(), depth: 0 }; render() })
  state = { ...fromHash(), depth: 0 }
  render()
  // Fonts change row heights, so re-lay out once they arrive.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => currentCanvas && currentCanvas.stage.isConnected && currentCanvas.draw())
})()
</script>
