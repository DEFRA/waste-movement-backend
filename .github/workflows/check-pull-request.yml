name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=critical
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run test:integration

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  schemathesis:
    name: Run Schemathesis API Contract Tests (beta-2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Schemathesis
        id: schemathesis
        run: |
          set -o pipefail
          mkdir -p test/schemathesis/out/reports
          test/schemathesis/run.sh 2>&1 | tee test/schemathesis/out/reports/schemathesis.log

      - name: Publish Schema Coverage Summary
        if: always()
        run: |
          report=test/schemathesis/out/reports/schema-coverage.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload Schemathesis Reports
        if: always()
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: test/schemathesis/out/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment Schemathesis Report on PR
        if: always() && github.event_name == 'pull_request'
        # Fork PRs get a read-only token; don't fail the job over the comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.schemathesis.outcome }}
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs')
            const dir = 'test/schemathesis/out/reports'
            const read = (file) =>
              fs.existsSync(`${dir}/${file}`) ? fs.readFileSync(`${dir}/${file}`, 'utf8') : ''

            const marker = '<!-- schemathesis-report -->'
            const passed = process.env.OUTCOME === 'success'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            // Schemathesis console output from the FAILURES (or SUMMARY) section on
            const log = read('schemathesis.log')
              .replace(/\x1b\[[0-9;]*m/g, '')
              .split('\n')
              .filter((line) => !/^\s*(Container|Network|Volume) /.test(line))
              .join('\n')
            const start = [/^=+ FAILURES =+$/m, /^=+ WARNINGS =+$/m, /^=+ SUMMARY =+$/m]
              .map((re) => log.search(re))
              .find((i) => i >= 0)
            const details = (start === undefined ? log.slice(-5000) : log.slice(start)).slice(0, 50000)

            const coverage = read('schema-coverage.md').replace(/^<!--.*-->\n/, '')

            const body = [
              marker,
              `## ${passed ? '✅' : '❌'} Schemathesis API contract tests (beta-2)`,
              '',
              passed
                ? 'All checks passed against `src/schemas/beta-2/openapi.json`.'
                : 'Schemathesis found failures against `src/schemas/beta-2/openapi.json` — see details below. Reproduce locally with `npm run test:schemathesis`.',
              '',
              `[Workflow run](${runUrl})` +
                (process.env.ARTIFACT_URL ? ` · [Download reports](${process.env.ARTIFACT_URL})` : ''),
              '',
              '<details><summary>Run output</summary>',
              '',
              '````',
              details.trim() || 'No output captured.',
              '````',
              '',
              '</details>',
              '',
              coverage
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number
            })
            const existing = comments.find((c) => c.body?.startsWith(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: pr-validator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker Compose Services
        id: start-docker-compose-services
        env:
          ORG_API_CODES: ${{ secrets.ORG_API_CODES }}
          ACCESS_CRED_WASTE_MOVEMENT_EXTERNAL_API: ${{ secrets.ACCESS_CRED_WASTE_MOVEMENT_EXTERNAL_API }}
          ACCESS_CRED_WASTE_MOVEMENT_BACKEND: ${{ secrets.ACCESS_CRED_WASTE_MOVEMENT_BACKEND }}
          ACCESS_CRED_WASTE_ORGANISATION_BACKEND: ${{ secrets.ACCESS_CRED_WASTE_ORGANISATION_BACKEND }}
          SERVICE_AUTH_PASSWORD: ${{ secrets.SERVICE_AUTH_PASSWORD }}
          SERVICE_AUTH_PASSWORD_WASTE_MOVEMENT_BACKEND: ${{ secrets.SERVICE_AUTH_PASSWORD_WASTE_MOVEMENT_BACKEND }}
          WASTE_CLIENT_AUTH_WASTE_MOVEMENT_EXTERNAL_API: ${{ secrets.WASTE_CLIENT_AUTH_WASTE_MOVEMENT_EXTERNAL_API }}
          ACCESS_CRED_QA_NON_PROD: ${{ secrets.ACCESS_CRED_QA_NON_PROD }}
          AUTH_PASSWORD_QA_NON_PROD: ${{ secrets.AUTH_PASSWORD_QA_NON_PROD }}
          ACCESS_CRED_PRODUCTION_APPROVAL_TESTS: ${{ secrets.ACCESS_CRED_PRODUCTION_APPROVAL_TESTS }}
          EXCLUDED_SUBMITTING_ORGANISATION_IDS: ${{ secrets.EXCLUDED_SUBMITTING_ORGANISATION_IDS }}
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
        run: |
          docker compose up -d --wait
          docker compose ps

      - name: Checkout UAT Repository as Integration Test Suite
        uses: actions/checkout@v4
        with:
          repository: DEFRA/digital-waste-tracking-uat
          path: integration-tests

      - name: Setup Node.js for Integration Test Suite
        uses: actions/setup-node@v4
        with:
          node-version-file: integration-tests/.nvmrc
          cache: npm
          cache-dependency-path: integration-tests/package-lock.json

      - name: Install Integration Test Dependencies
        working-directory: integration-tests
        run: npm ci --ignore-scripts

      - name: Run Integration Tests
        id: integration-tests
        working-directory: integration-tests
        env:
          WASTE_MOVEMENT_EXTERNAL_API_BASE_URL: http://waste-tracking-external-api:3001
          WASTE_MOVEMENT_BACKEND_API_BASE_URL: http://waste-movement-backend:3001
          WASTE_ORGANISATION_BACKEND_API_BASE_URL: http://waste-organisation-backend:3001
          DWT_CLIENT_SYNC_SERVICE_URL: http://dwt-client-sync:3001
          HTTP_PROXY: http://localhost:8080
          PROXY_MODE: ${{ vars.PROXY_MODE }}
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
          AUTH_DISABLED: ${{ vars.AUTH_DISABLED }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_CLIENT_NAME: ${{ secrets.COGNITO_CLIENT_NAME }}
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          COGNITO_CLIENT_ID_2: ${{ secrets.COGNITO_CLIENT_ID_2 }}
          COGNITO_CLIENT_NAME_2: ${{ secrets.COGNITO_CLIENT_NAME_2 }}
          COGNITO_CLIENT_SECRET_2: ${{ secrets.COGNITO_CLIENT_SECRET_2 }}
          COGNITO_OAUTH_BASE_URL: ${{ secrets.COGNITO_OAUTH_BASE_URL }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          API_LOGGING: true
          JIRA_BASE_URL: https://eaflood.atlassian.net/browse
          PROFILE: integration
          SERVICE_AUTH_PASSWORD: ${{ secrets.SERVICE_AUTH_PASSWORD }}
          SERVICE_AUTH_PASSWORD_WASTE_ORGANISATION_BACKEND: ${{ secrets.SERVICE_AUTH_PASSWORD_WASTE_ORGANISATION_BACKEND }}
          AUTH_PASSWORD_QA_NON_PROD: ${{ secrets.AUTH_PASSWORD_QA_NON_PROD }}
          AUTH_PASSWORD_PRODUCTION_APPROVAL_TESTS: ${{ secrets.AUTH_PASSWORD_PRODUCTION_APPROVAL_TESTS }}
        run: |
          npm run test
          npm run test:zap-gate

      - name: Generate Test Report
        if: always()
        id: generate-report
        working-directory: integration-tests
        run: npm run report:generate

      - name: Upload Test Report
        if: always() && steps.generate-report.outcome == 'success'
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: integration-tests/allure-report/
          retention-days: 30

      - name: Comment Test Report Link on PR
        if: always() && steps.upload-report.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const statusEmoji = '${{ steps.integration-tests.outcome }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Integration Test Report ${statusEmoji}\n\nThe test report has been generated and is available as an artifact.\n\n📥 [Download Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-report.outputs.artifact-id }})`
            })

      - name: Stop Docker Compose Services
        if: always() && steps.start-docker-compose-services.outcome == 'success'
        run: docker compose down
