name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=critical
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run test:integration
          npm run test:schema-explorer

      # The schema explorer for this PR, with a "What's changed" view comparing
      # its schemas with the base branch's. The changes are also written to the
      # run's summary, and the site is attached to the run: download the
      # schema-explorer artifact, unzip it and open index.html.
      - name: Build schema explorer with changes since the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          npm run docs:schemas -- --since "origin/${BASE_REF}" --changes-md schema-changes.md
          cat schema-changes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach schema explorer to the run
        uses: actions/upload-artifact@v4
        with:
          name: schema-explorer
          path: .schema-explorer
          retention-days: 14

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs this repo's integration tests against the shared stack (see compose.yml)
  integration-tests:
    name: Run Integration Tests
    needs: pr-validator
    uses: DEFRA/digital-waste-tracking-uat/.github/workflows/integration-tests.yml@main
