name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=critical
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run test:integration

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  schemathesis:
    name: Run Schemathesis API Contract Tests (beta-2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Schemathesis
        id: schemathesis
        run: |
          set -o pipefail
          mkdir -p test/schemathesis/out/reports
          test/schemathesis/run.sh 2>&1 | tee test/schemathesis/out/reports/schemathesis.log

      - name: Publish Schema Coverage Summary
        if: always()
        run: |
          report=test/schemathesis/out/reports/schema-coverage.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload Schemathesis Reports
        if: always()
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: test/schemathesis/out/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment Schemathesis Report on PR
        if: always() && github.event_name == 'pull_request'
        # Fork PRs get a read-only token; don't fail the job over the comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.schemathesis.outcome }}
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs')
            const dir = 'test/schemathesis/out/reports'
            const read = (file) =>
              fs.existsSync(`${dir}/${file}`) ? fs.readFileSync(`${dir}/${file}`, 'utf8') : ''

            const marker = '<!-- schemathesis-report -->'
            const passed = process.env.OUTCOME === 'success'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            // Schemathesis console output from the FAILURES (or SUMMARY) section on
            const log = read('schemathesis.log')
              .replace(/\x1b\[[0-9;]*m/g, '')
              .split('\n')
              .filter((line) => !/^\s*(Container|Network|Volume) /.test(line))
              .join('\n')
            const start = [/^=+ FAILURES =+$/m, /^=+ WARNINGS =+$/m, /^=+ SUMMARY =+$/m]
              .map((re) => log.search(re))
              .find((i) => i >= 0)
            const details = (start === undefined ? log.slice(-5000) : log.slice(start)).slice(0, 50000)

            const coverage = read('schema-coverage.md').replace(/^<!--.*-->\n/, '')

            const body = [
              marker,
              `## ${passed ? '✅' : '❌'} Schemathesis API contract tests (beta-2)`,
              '',
              passed
                ? 'All checks passed against `src/schemas/beta-2/openapi.json`.'
                : 'Schemathesis found failures against `src/schemas/beta-2/openapi.json` — see details below. Reproduce locally with `npm run test:schemathesis`.',
              '',
              `[Workflow run](${runUrl})` +
                (process.env.ARTIFACT_URL ? ` · [Download reports](${process.env.ARTIFACT_URL})` : ''),
              '',
              '<details><summary>Run output</summary>',
              '',
              '````',
              details.trim() || 'No output captured.',
              '````',
              '',
              '</details>',
              '',
              coverage
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number
            })
            const existing = comments.find((c) => c.body?.startsWith(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  integration-tests:
    name: Run Integration Tests
    needs: pr-validator
    uses: DEFRA/digital-waste-tracking-uat/.github/workflows/integration-tests.yml@main
